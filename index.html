    <script>
      (function() {
        if (window.location.hash) {
          var h = window.location.hash.replace(/^#\/?/, '').replace(/^article\//, '').trim();
          var target = h ? '/' + h : (window.location.pathname || '/');
          window.history.replaceState(null, '', target);
        }
        try {
          var defaultOrigin = 'https://fitness-and-health-blog-ten.vercel.app';
          var origin = defaultOrigin;
          if (window.location && window.location.origin && window.location.origin.indexOf('http') === 0) {
            var currOrigin = window.location.origin;
            if (
              currOrigin.indexOf('run.app') === -1 &&
              currOrigin.indexOf('localhost') === -1 &&
              currOrigin.indexOf('127.0.0.1') === -1 &&
              currOrigin.indexOf('webcontainer') === -1
            ) {
              origin = currOrigin;
            }
          }
          var rawPath = window.location.pathname || '/';
          var cleanPath = rawPath.replace(/^\/+|\/+$/g, '');
          var canonicalPath = cleanPath
            ? '/' + (cleanPath.indexOf('article/') === 0 ? cleanPath.replace('article/', '') : cleanPath)
            : '/';
          var fullCanonical = origin + canonicalPath;

          var c = document.querySelector('link[rel="canonical"]');
          if (c) c.setAttribute('href', fullCanonical);
          var og = document.querySelector('meta[property="og:url"]');
          if (og) og.setAttribute('content', fullCanonical);
        } catch (e) {}
      })();
    </script>
